<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
<style>
@media (prefers-reduced-motion: no-preference) {
  #jump-caret { animation: jump-blink 1.1s steps(1) infinite; }
  #jump-cursor { animation: jump-bob 2.6s ease-in-out infinite alternate; }
}
@keyframes jump-blink { 50% { opacity: 0; } }
@keyframes jump-bob {
  from { transform: translate(0, -2px); }
  to { transform: translate(2px, 3px); }
}
</style>
