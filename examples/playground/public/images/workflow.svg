<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
<style>
@media (prefers-reduced-motion: no-preference) {
  #wf-caret { animation: wf-blink 1.1s steps(1) infinite; }
  #wf-arrow { animation: wf-nudge 2.8s ease-in-out infinite; }
  #wf-line { animation: wf-pulse 3.6s ease-in-out infinite; }
}
@keyframes wf-blink { 50% { opacity: 0; } }
@keyframes wf-nudge {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(5px, 0); }
}
@keyframes wf-pulse {
  0%, 100% { opacity: 0.8; }
  50% { opacity: 0.45; }
}
</style>
