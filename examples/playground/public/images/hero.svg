<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
<style>
@media (prefers-reduced-motion: no-preference) {
  #caret { animation: caret-move 9s ease-in-out infinite, blink 1.1s steps(1) infinite; }
  #highlight { animation: highlight-move 9s ease-in-out infinite; }
  #cursor-hop { animation: cursor-hop 9s ease-in-out infinite; }
  #cursor-bob { animation: cursor-bob 2.6s ease-in-out infinite alternate; }
  #lineA { animation: sel-a 9s linear infinite; }
  #lineB { animation: sel-b 9s linear infinite; }
  #lineC { animation: sel-c 9s linear infinite; }
}
@keyframes blink { 50% { opacity: 0; } }
@keyframes highlight-move {
  0%, 30% { transform: translate(0, 0); }
  36%, 63% { transform: translate(0, 34px); }
  69%, 94% { transform: translate(0, -34px); }
  100% { transform: translate(0, 0); }
}
@keyframes caret-move {
  0%, 30% { transform: translate(0, 0); }
  36%, 63% { transform: translate(32px, 34px); }
  69%, 94% { transform: translate(61px, -34px); }
  100% { transform: translate(0, 0); }
}
@keyframes cursor-hop {
  0%, 30% { transform: translate(-6px, -44px); }
  36%, 63% { transform: translate(24px, -8px); }
  69%, 94% { transform: translate(44px, -80px); }
  100% { transform: translate(-6px, -44px); }
}
@keyframes cursor-bob {
  from { transform: translate(0, -3px); }
  to { transform: translate(3px, 4px); }
}
@keyframes sel-b {
  0%, 30% { fill: #7c5cff; }
  36%, 97% { fill: #cfc7e2; }
  100% { fill: #7c5cff; }
}
@keyframes sel-c {
  0%, 30% { fill: #cfc7e2; }
  36%, 63% { fill: #7c5cff; }
  69%, 100% { fill: #cfc7e2; }
}
@keyframes sel-a {
  0%, 63% { fill: #cfc7e2; }
  69%, 94% { fill: #7c5cff; }
  100% { fill: #cfc7e2; }
}
</style>
<rect width="800" height="450" fill="#fdfcff"/>
<circle cx="710" cy="70" r="130" fill="#ebe6f7" opacity="0.6"/>
<circle cx="60" cy="410" r="90" fill="#cfc7e2" opacity="0.35"/>

<rect x="120" y="60" width="560" height="330" rx="16" fill="#ffffff" stroke="#ebe6f7" stroke-width="2"/>
<rect x="120" y="60" width="560" height="54" rx="16" fill="#363150"/>
<circle cx="152" cy="87" r="8" fill="#7c5cff"/>
<circle cx="178" cy="87" r="8" fill="#cfc7e2"/>
<circle cx="204" cy="87" r="8" fill="#fdfcff"/>
<rect x="160" y="150" width="300" height="22" rx="11" fill="#363150"/>
<rect id="lineA" x="160" y="210" width="480" height="14" rx="7" fill="#cfc7e2"/><rect id="lineB" x="160" y="244" width="413" height="14" rx="7" fill="#7c5cff"/><rect id="caret" x="583" y="239" width="4" height="24" rx="2" fill="#363150"/><rect id="lineC" x="160" y="278" width="451" height="14" rx="7" fill="#cfc7e2"/><rect x="160" y="312" width="264" height="14" rx="7" fill="#cfc7e2"/>
<rect id="highlight" x="150" y="238" width="510" height="34" rx="8" fill="none" stroke="#7c5cff" stroke-width="3"/>
<g id="cursor-hop"><g id="cursor-bob"><path transform="translate(600 300) scale(1.4)" fill="#363150" d="M0 0 L0 22 L5.5 17 L9 25 L12.5 23.5 L9 15.5 L16 15 Z"/></g></g>

</svg>
